<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17a996"/>
      <stop offset="1" stop-color="#0c6156"/>
    </linearGradient>
  </defs>
  <!-- Background (full square, Play Store applies its own masking) -->
  <rect x="0" y="0" width="108" height="108" fill="url(#bg)"/>
